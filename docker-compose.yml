name: revopshq-client

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: revopshq_client
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d revopshq_client"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches outgoing mail in development. Magic links land at http://localhost:8026.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  db-data:
